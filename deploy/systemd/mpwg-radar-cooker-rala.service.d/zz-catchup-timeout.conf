[Service]
# Host drop-ins (systemctl edit writes override.conf) have set
# TimeoutStartSec=1800, which is the composite cap. That SIGTERMs a RALA
# catch-up before MPWG_RALA_CATCHUP_BUDGET_SECONDS (2700) plus the last
# upload, so the oneshot never finishes the 2-minute scans already listed.
# This filename sorts after override.conf, so 4200 wins. Composite is not
# installed here and stays at 1800.
TimeoutStartSec=4200
