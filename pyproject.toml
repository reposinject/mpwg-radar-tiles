[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpwg-radar"
version = "1.0.0"
description = "MPWG NOAA MRMS radar tile cooker for CONUS (512px XYZ → Cloudflare R2)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MPWG" }]
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10.0,<12",
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mpwg-radar = "mpwg_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mpwg_radar = ["palettes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: hits NOAA MRMS over the network",
]
